<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>远征界面自检</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style></head>
<body>
<iframe id="f" src="../index.html"></iframe>
<script>
/* 远征各界面的截图自检，用法同 ui-check.html：
   ?stage=hub|backup|import|map|world|boss|reward|shop|rest|event|altar|over|battle|charge|bossfight|field|night|flow
   battle / charge 会真的进一场远征战斗（爽快规则），charge 额外按住空格看弹道预览。 */
var stage = new URLSearchParams(location.search).get('stage') || 'map';
document.getElementById('f').onload = function () {
  var w = this.contentWindow, d = w.document, RZ = w.RZ, Run = RZ.Run;
  try { w.localStorage.removeItem('rz-run'); } catch (e) {}
  d.querySelector('[data-go="run"]').click();
  if (stage === 'hub') return;
  if (stage === 'backup') {                       // 营地里展开「导出进度」
    var m0 = Run.loadMeta(); m0.sinceBackup = 3; m0.medals = 9; Run.saveMeta(m0);
    RZ.RunUI.render();
    d.querySelector('[data-act="bk-export"]').click();
    d.querySelector('.run-root').scrollTop = 9999;
    return;
  }
  if (stage === 'import') {                       // 粘贴一串进度码 → 读取 → 看到覆盖确认
    var keep = Run.loadMeta(), far = Run.newRun('honglong');
    far.act = 1; far.step = 2; Run.save(far);
    Run.saveMeta({ medals: 23, unlocked: ['liehuo', 'tiejingang', 'beibeilong', 'honglong'], wins: 1, asc: 1, runs: 6, best: 11 });
    var code = Run.exportCode();
    Run.clear(); Run.saveMeta(keep);
    d.querySelector('[data-act="bk-import"]').click();
    d.getElementById('bk-in').value = code;
    d.querySelector('[data-act="bk-read"]').click();
    return;
  }

  var s = Run.newRun('liehuo');
  // 带一对凑成的联动（余震装置 + 爆破专家）和一件诅咒（赌徒骰子），侧栏上三种遗物条都看得到
  s.relics = ['crit', 'after', 'demo', 'dice']; s.mods.w1 = ['split', 'cluster']; s.mods.ss = ['burn']; s.gold = 135; s.hp = 640;
  if (stage === 'reward') { Run.enter(s, 0); s.pending = { kind: 'reward', from: 'fight', gold: 48, style: 13,
    choices: [{ type: 'mod', id: 'chain' }, { type: 'relic', id: 'combo' }, { type: 'relic', id: 'plate' }] }; }
  if (stage === 'shop') { s.step = 2; Run.enter(s, 1); }
  if (stage === 'rest') { s.step = 2; Run.enter(s, 2); }
  if (stage === 'event') { s.gold = 20; s.pending = { kind: 'event', id: 'convoy' }; }   // 钱不够，第一个选项灰掉
  if (stage === 'over') { s.battles = 7; s.bosses = 1; s.act = 1; s.step = 3; Run.finish(s, false); }
  if (stage === 'boss' || stage === 'bossfight') { s.step = 4; }
  if (stage === 'altar') { s.pending = { kind: 'event', id: 'altar' }; }
  var foe = function (o) { var e = { vid: 'honglong', name: '红龙', hpMul: 0.7, atkMul: 0.7, mods: { w1: [], w2: [], ss: [] }, perks: {} }; for (var k in o) e[k] = o[k]; return e; };
  if (stage === 'world') {                        // v1.4 的新东西摆满一层：特殊敌人 + 词条、限时挑战、祭坛
    s.act = 1; s.step = 3;
    s.layers[3] = [
      { type: 'fight', mapId: 'sea', gold: 66, mods: ['night'], enemies: [
        foe({ kind: 'turret', vid: 'tuoer', name: '炮台·托尔', perks: { rooted: 1, anchor: 1 }, hpMul: 0.9 }),
        foe({ kind: 'bomber', vid: 'liehuo', name: '自爆车', perks: { kamikaze: 1 }, hpMul: 0.25 }),
        foe({ kind: 'bomber', vid: 'liehuo', name: '自爆车', perks: { kamikaze: 1 }, hpMul: 0.25 })] },
      { type: 'trial', mapId: 'sky', gold: 88, limit: 5, mods: [], enemies: [foe({ name: '逃兵·红龙' })] },
      { type: 'altar' }];
  }
  if (stage === 'night') {                        // 夜战 + 陨石雨：炮台、自爆车、小车各一
    s.layers[0] = [{ type: 'fight', mapId: 'dry', gold: 40, mods: ['night', 'meteor'], enemies: [
      foe({ kind: 'turret', vid: 'tuoer', name: '炮台·托尔', perks: { rooted: 1, anchor: 1 } }),
      foe({ kind: 'bomber', vid: 'liehuo', name: '自爆车', perks: { kamikaze: 1 }, scale: 0.85 }),
      foe({ kind: 'swarm', vid: 'xuanfeng', name: '游骑·旋风', scale: 0.72 })] }];
  }
  RZ.RunUI._set(s);
  if (stage === 'reward') d.querySelector('.offer.mod [data-act="take"]').click();   // 展开「装到哪把武器」
  if (['battle', 'charge', 'flow', 'bossfight', 'field', 'night'].indexOf(stage) < 0) return;

  d.querySelector('[data-act="enter"]').click();
  setTimeout(function () {
    var g = w.__game;
    for (var i = 0; i < 40; i++) g.update(16);
    if (stage === 'charge') {
      g.active.aim = 52;
      g.active.lastPower = 58;                    // 上一发 58，这一发标到 64：细线 + 粗线都该看得到
      g.setMark(64);
      g.startCharge();
      for (i = 0; i < 64; i++) g.update(16);      // 正好蓄到标记上
      g.banner = { text: '直击！', sub: '+5 金', life: 60, max: 70 };
    }
    if (stage === 'field') {                      // 四种区域一字排开 + 一块 Boss 警戒线，镜头对着玩家
      var me = g.units[0], gy = function (x) { return g.terrain.groundBelow(x, 0); };
      g.addHazard('fire', me.x + 150, gy(me.x + 150), 60, 2, 34, me);
      g.addHazard('pool', me.x + 300, gy(me.x + 300), 44, 3, 24, me);
      g.addHazard('web', me.x + 450, gy(me.x + 450), 80, 3, 0, me);
      g.addHazard('twister', me.x + 620, gy(me.x + 620) - 20, 52, 2, 0, me);
      g.telegraphs.push({ x: me.x - 10, r: 62, owner: g.units[1], strike: 'mortar', power: 150, born: 0, seed: 1 });
      g.cam.x = g.cam.tx = Math.max(0, me.x - 220);
      g.cam.y = g.cam.ty = Math.max(0, me.y - g.viewH * 0.55);
      g.updateCamera = function () {};
    }
    if (stage === 'night') {                      // 三个敌人摆到玩家右边：一个在 420px 内（看得见），两个在暗处
      var p0 = g.units[0], yy = function (x) { return g.terrain.groundBelow(x, 0); };
      [[1, 520], [2, 250], [3, 640]].forEach(function (a) { var u = g.units[a[0]]; u.x = p0.x + a[1]; u.y = yy(u.x); u.airborne = false; u.face = -1; });
      g.units[1].lastSeenX = p0.x + 520; g.units[1].lastSeenY = yy(p0.x + 520);
      g.units[3].lastSeenX = p0.x + 700; g.units[3].lastSeenY = yy(p0.x + 700);
      g.cam.x = g.cam.tx = Math.max(0, p0.x - 200);
      g.cam.y = g.cam.ty = Math.max(0, p0.y - g.viewH * 0.55);
      g.updateCamera = function () {};
    }
    if (stage === 'bossfight') {                  // 镜头拉到 Boss 身上，看体型和油桶
      var boss = g.units[1];
      g.cam.x = g.cam.tx = Math.max(0, Math.min(RZ.WORLD_W - g.viewW, boss.x - g.viewW / 2));
      g.cam.y = g.cam.ty = Math.max(0, boss.y - g.viewH / 2);
      g.updateCamera = function () {};
    }
    if (stage === 'flow') {                       // 打赢 → 点「继续」→ 应该回到远征界面的三选一
      g.units.slice(1).forEach(function (u) { g.damage(u, 99999, g.units[0]); });
      g.checkWin();                               // 正常是回合结束时判定，这里直接判
      d.getElementById('btn-continue').click();
    }
  }, 80);
};
</script>
</body></html>
