<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>远征界面自检</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style></head>
<body>
<iframe id="f" src="../index.html"></iframe>
<script>
/* 远征各界面的截图自检，用法同 ui-check.html：
   ?stage=hub|map|boss|reward|shop|rest|event|over|battle|charge|bossfight|flow
   battle / charge 会真的进一场远征战斗（爽快规则），charge 额外按住空格看弹道预览。 */
var stage = new URLSearchParams(location.search).get('stage') || 'map';
document.getElementById('f').onload = function () {
  var w = this.contentWindow, d = w.document, RZ = w.RZ, Run = RZ.Run;
  try { w.localStorage.removeItem('rz-run'); } catch (e) {}
  d.querySelector('[data-go="run"]').click();
  if (stage === 'hub') return;

  var s = Run.newRun('liehuo');
  s.relics = ['crit', 'after', 'tank']; s.mods.w1 = ['split', 'cluster']; s.mods.ss = ['burn']; s.gold = 135; s.hp = 640;
  if (stage === 'reward') { Run.enter(s, 0); s.pending = { kind: 'reward', from: 'fight', gold: 48, style: 13,
    choices: [{ type: 'mod', id: 'apex' }, { type: 'relic', id: 'combo' }, { type: 'relic', id: 'plate' }] }; }
  if (stage === 'shop') { s.step = 2; Run.enter(s, 1); }
  if (stage === 'rest') { s.step = 2; Run.enter(s, 2); }
  if (stage === 'event') { s.pending = { kind: 'event', id: 'tuner' }; }
  if (stage === 'over') { s.battles = 7; s.bosses = 1; s.act = 1; s.step = 3; Run.finish(s, false); }
  if (stage === 'boss' || stage === 'bossfight') { s.step = 4; }
  RZ.RunUI._set(s);
  if (stage === 'reward') d.querySelector('.offer.mod [data-act="take"]').click();   // 展开「装到哪把武器」
  if (['battle', 'charge', 'flow', 'bossfight'].indexOf(stage) < 0) return;

  d.querySelector('[data-act="enter"]').click();
  setTimeout(function () {
    var g = w.__game;
    for (var i = 0; i < 40; i++) g.update(16);
    if (stage === 'charge') {
      g.active.aim = 52;
      g.startCharge();
      for (i = 0; i < 48; i++) g.update(16);
      g.banner = { text: '直击！', sub: '+5 金', life: 60, max: 70 };
    }
    if (stage === 'bossfight') {                  // 镜头拉到 Boss 身上，看体型和油桶
      var boss = g.units[1];
      g.cam.x = g.cam.tx = Math.max(0, Math.min(RZ.WORLD_W - g.viewW, boss.x - g.viewW / 2));
      g.cam.y = g.cam.ty = Math.max(0, boss.y - g.viewH / 2);
      g.updateCamera = function () {};
    }
    if (stage === 'flow') {                       // 打赢 → 点「继续」→ 应该回到远征界面的三选一
      g.units.slice(1).forEach(function (u) { g.damage(u, 99999, g.units[0]); });
      g.checkWin();                               // 正常是回合结束时判定，这里直接判
      d.getElementById('btn-continue').click();
    }
  }, 80);
};
</script>
</body></html>
