<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>音效自检 / 试听</title>
<style>
body{margin:0;padding:24px;background:#d8361f;color:#1b1410;font:14px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}
h1{font-size:22px;margin:0 0 4px} p{margin:0 0 14px;max-width:60em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
button{font:inherit;text-align:left;padding:8px 12px;background:#f1e2bd;border:3px solid #1b1410;box-shadow:4px 4px 0 #1b1410;cursor:pointer}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1b1410}
button b{display:block;font-size:16px} button small{color:#4a392c}
button.bad{background:#f5b921}
#report{white-space:pre;font:12px/1.5 monospace;background:#f1e2bd;border:3px solid #1b1410;padding:12px;margin-top:18px}
</style></head>
<body>
<h1>音效自检 / 试听</h1>
<p>点按钮试听。页面加载时会把每个声音离线渲染一遍，量峰值、响度和时长写在按钮上和下面的报告里——
   没声（峰值过低）、可能爆音（峰值 ≥ 0.98）或者算出 NaN 的会标黄。蓄力鼓点是连续的，单独一个按钮。</p>
<div class="grid" id="grid"></div>
<div id="report">渲染中…</div>
<script>window.RZ = window.RZ || {};</script>
<script src="../js/audio.js"></script>
<script>
var SFX = RZ.SFX, grid = document.getElementById('grid');
// 带参数的声音各试一遍
var cases = [], KINDS = ['gun', 'heavy', 'flame', 'zap', 'volt', 'goo', 'wind', 'steel', 'egg'];
SFX.names().forEach(function (n) {
  if (n === 'explode') {
    KINDS.forEach(function (k) { cases.push([n, { big: false, kind: k }, k]); });
    cases.push([n, { big: true, kind: 'gun' }, 'gun 大']); cases.push([n, { big: true, kind: 'heavy' }, 'heavy 大']);
  }
  else if (n === 'fire') KINDS.forEach(function (k) { cases.push([n, k, k]); });
  else if (n === 'turn') { cases.push([n, true, '轮到你']); cases.push([n, false, '轮到对面']); }
  else cases.push([n, undefined, '']);
});
var lines = [], pending = cases.length, bad = 0;
function done() {
  if (--pending) return;
  document.getElementById('report').textContent =
    '名字            峰值    响度(RMS)  时长(s)\n' + lines.sort().join('\n') + '\n\n' + cases.length + ' 个声音，异常 ' + bad + ' 个';
  document.title = 'SFX ' + (bad ? 'BAD ' + bad : 'OK ' + cases.length);
}
cases.forEach(function (c) {
  var btn = document.createElement('button');
  btn.innerHTML = '<b>' + c[0] + (c[2] ? '（' + c[2] + '）' : '') + '</b><small>…</small>';
  btn.onclick = function () { SFX.resume(); SFX[c[0]](c[1]); };
  grid.appendChild(btn);
  var pr = SFX._offline(c[0], c[1], 3.5);
  if (!pr) { btn.lastChild.textContent = '这个浏览器不支持离线渲染'; done(); return; }
  pr.then(function (buf) {
    var d = buf.getChannelData(0), peak = 0, sum = 0, last = 0, nan = false;
    for (var i = 0; i < d.length; i++) {
      var v = Math.abs(d[i]);
      if (v !== v) nan = true;
      if (v > peak) peak = v;
      sum += v * v;
      if (v > 0.002) last = i;
    }
    var dur = last / buf.sampleRate, rms = Math.sqrt(sum / Math.max(1, last));
    var isBad = nan || peak < 0.02 || peak >= 0.98;
    if (isBad) { bad++; btn.className = 'bad'; }
    btn.lastChild.textContent = '峰值 ' + peak.toFixed(2) + ' · 时长 ' + dur.toFixed(2) + 's' + (nan ? ' · NaN!' : '');
    var name = c[0] + (c[2] ? '/' + c[2] : '');
    lines.push((name + '                ').slice(0, 16) + peak.toFixed(3) + '   ' + rms.toFixed(3) + '      ' + dur.toFixed(2) + (isBad ? '   <-- 异常' : ''));
    done();
  });
});
// 蓄力鼓点：按住试听
var cb = document.createElement('button'), timer = 0, p = 0;
cb.innerHTML = '<b>蓄力鼓点（按住）</b><small>越蓄越密、越高</small>';
cb.onpointerdown = function () { SFX.resume(); SFX.startCharge(); p = 0; timer = setInterval(function () { p = Math.min(100, p + 1.3); SFX.updateCharge(p); }, 16); };
cb.onpointerup = cb.onpointerleave = function () { clearInterval(timer); SFX.stopCharge(); };
grid.appendChild(cb);
</script>
</body></html>
